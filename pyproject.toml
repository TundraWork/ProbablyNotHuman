[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "probably-not-human"
version = "1.2.0"
description = "Client and MCP server for Probably Not Human, the AI agent bridge mod for Probably Stolen"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/TundraWork/ProbablyNotHuman"

[project.scripts]
probably-not-human = "probably_not_human.__main__:main"

[tool.setuptools.packages.find]
include = ["probably_not_human*"]
